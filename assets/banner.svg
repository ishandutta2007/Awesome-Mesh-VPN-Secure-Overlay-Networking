<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Mesh Wireframe Line Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Node Filters -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowPurple" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Badge Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <style>
    @keyframes pulseFade {
      0%, 100% { opacity: 0.25; transform: scale(0.98); }
      50% { opacity: 0.85; transform: scale(1.02); }
    }
    @keyframes dashTravel1 {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dashTravel2 {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 400; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.9; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes haloPulse {
      0%, 100% { r: 6px; opacity: 0.4; }
      50% { r: 14px; opacity: 0.85; }
    }

    .bg-mesh-line {
      stroke-dasharray: 8 12;
      animation: dashTravel1 20s linear infinite;
    }
    .bg-mesh-line-reverse {
      stroke-dasharray: 6 10;
      animation: dashTravel2 25s linear infinite;
    }
    .node-pulse {
      animation: haloPulse 3s ease-in-out infinite;
    }
    .particle-float {
      animation: floatParticle 6s ease-in-out infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Geometric Grid Accent Overlay (Background Layer) -->
  <g opacity="0.12">
    <line x1="0" y1="60" x2="1200" y2="60" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="120" x2="1200" y2="120" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="180" x2="1200" y2="180" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="240" x2="1200" y2="240" stroke="#38bdf8" stroke-width="1" />
    <line x1="0" y1="300" x2="1200" y2="300" stroke="#38bdf8" stroke-width="1" />
    <line x1="150" y1="0" x2="150" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="300" y1="0" x2="300" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="450" y1="0" x2="450" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="600" y1="0" x2="600" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="750" y1="0" x2="750" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="900" y1="0" x2="900" y2="360" stroke="#38bdf8" stroke-width="1" />
    <line x1="1050" y1="0" x2="1050" y2="360" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Ambient Dynamic P2P Mesh Network Overlay (Positioned in Background / Borders) -->
  <g opacity="0.55">
    <!-- Mesh Connecting Lines -->
    <path class="bg-mesh-line" d="M 80,70 L 220,130 L 160,280 L 80,70 Z" fill="none" stroke="url(#cyanLine)" stroke-width="1.5" />
    <path class="bg-mesh-line-reverse" d="M 220,130 L 380,70 L 340,240 L 160,280 Z" fill="none" stroke="url(#purpleLine)" stroke-width="1.2" />
    <path class="bg-mesh-line" d="M 820,60 L 980,110 L 910,260 L 760,210 Z" fill="none" stroke="url(#cyanLine)" stroke-width="1.5" />
    <path class="bg-mesh-line-reverse" d="M 980,110 L 1120,60 L 1140,240 L 910,260 Z" fill="none" stroke="url(#emeraldLine)" stroke-width="1.4" />
    <path class="bg-mesh-line" d="M 1040,180 L 1150,290 L 880,310 Z" fill="none" stroke="url(#purpleLine)" stroke-width="1.2" />

    <!-- Animated Mesh Peer Nodes -->
    <!-- Left Cluster -->
    <circle cx="80" cy="70" r="4" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle class="node-pulse" cx="80" cy="70" r="10" fill="none" stroke="#38bdf8" stroke-width="1" />

    <circle cx="220" cy="130" r="5" fill="#a855f7" filter="url(#glowPurple)" />
    <circle class="node-pulse" cx="220" cy="130" r="12" fill="none" stroke="#c084fc" stroke-width="1" />

    <circle cx="160" cy="280" r="4" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="380" cy="70" r="3.5" fill="#34d399" filter="url(#glowCyan)" />
    <circle cx="340" cy="240" r="4.5" fill="#a855f7" filter="url(#glowPurple)" />

    <!-- Right Cluster -->
    <circle cx="820" cy="60" r="4" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="980" cy="110" r="5" fill="#34d399" filter="url(#glowCyan)" />
    <circle class="node-pulse" cx="980" cy="110" r="12" fill="none" stroke="#34d399" stroke-width="1" />

    <circle cx="910" cy="260" r="4.5" fill="#a855f7" filter="url(#glowPurple)" />
    <circle cx="760" cy="210" r="3.5" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle cx="1120" cy="60" r="4" fill="#a855f7" filter="url(#glowPurple)" />
    <circle cx="1140" cy="240" r="5" fill="#38bdf8" filter="url(#glowCyan)" />
    <circle class="node-pulse" cx="1140" cy="240" r="13" fill="none" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Subtle Floating Data Packets -->
  <g class="particle-float">
    <circle cx="140" cy="95" r="2" fill="#38bdf8" />
    <circle cx="260" cy="210" r="2.5" fill="#c084fc" />
    <circle cx="890" cy="85" r="2" fill="#34d399" />
    <circle cx="1060" cy="180" r="2.5" fill="#38bdf8" />
  </g>

  <!-- Center Foreground Content Area (Never obscured) -->
  <g id="foreground-content">
    <!-- Top Category Tag Pill -->
    <g transform="translate(600, 72)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="-116" cy="0" r="4" fill="#10b981" />
      <text x="-98" y="4" fill="#94a3b8" class="pill-text">P2P OVERLAYS &bull; WIREGUARD &bull; ZTNA</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="148" text-anchor="middle" fill="#f8fafc" font-size="38" class="title-text">
      Awesome Mesh VPN &amp; Secure Overlays
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="600" y="188" text-anchor="middle" fill="#94a3b8" font-size="16" class="subtitle-text">
      Curated Zero-Trust Overlay Networks, P2P NAT Hole-Punching &amp; Encrypted Tunnels
    </text>

    <!-- Tech Architecture Feature Badges in Foreground -->
    <g transform="translate(600, 246)">
      <!-- Badge 1: WireGuard -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" class="pill-text">⚡ WIREGUARD</text>
      </g>
      <!-- Badge 2: Headscale / Control Planes -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="5" text-anchor="middle" fill="#a5b4fc" class="pill-text">🌐 HEADSCALE / P2P</text>
      </g>
      <!-- Badge 3: Zero Trust ZTNA -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="5" text-anchor="middle" fill="#e879f9" class="pill-text">🔒 ZERO-TRUST ZTNA</text>
      </g>
      <!-- Badge 4: NAT Traversal -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" class="pill-text">🕳️ NAT TRAVERSAL</text>
      </g>
      <!-- Badge 5: Multi-Cloud Mesh -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1" stroke-opacity="0.4" />
        <text x="0" y="5" text-anchor="middle" fill="#fde68a" class="pill-text">☁️ MULTI-CLOUD</text>
      </g>
    </g>

    <!-- Bottom Secondary Metrics / Meta -->
    <text x="600" y="306" text-anchor="middle" fill="#64748b" font-size="12" class="subtitle-text">
      Enterprise SaaS Suites &bull; Self-Hosted Control Planes &bull; Cryptographic PKI Meshes
    </text>
  </g>
</svg>