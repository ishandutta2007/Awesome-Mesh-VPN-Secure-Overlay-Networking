<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Mesh Wireframe Line Gradients -->
    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="purpleLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="emeraldLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glowing Node Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.7" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="url(#grid)"/>

  <!-- Ambient Dynamic P2P Mesh Network Wave Elements (Background Layer) -->
  <g opacity="0.35">
    <path d="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,340 L 0,340 Z" fill="#0284c7">
      <animate attributeName="d" dur="10s" repeatCount="indefinite"
        values="M 0,160 Q 300,80 600,160 T 1200,160 L 1200,340 L 0,340 Z;
                M 0,190 Q 300,250 600,140 T 1200,190 L 1200,340 L 0,340 Z;
                M 0,160 Q 300,80 600,160 T 1200,160 L 1200,340 L 0,340 Z"/>
    </path>
    <path d="M 0,210 Q 400,290 800,180 T 1200,230 L 1200,340 L 0,340 Z" fill="#6366f1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite"
        values="M 0,210 Q 400,290 800,180 T 1200,230 L 1200,340 L 0,340 Z;
                M 0,160 Q 400,110 800,230 T 1200,180 L 1200,340 L 0,340 Z;
                M 0,210 Q 400,290 800,180 T 1200,230 L 1200,340 L 0,340 Z"/>
    </path>
  </g>

  <!-- Dynamic Animated Mesh Lines & Nodes in Background / Flanks -->
  <g opacity="0.55">
    <path d="M 70,60 L 190,120 L 140,260 L 70,60 Z" fill="none" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="6,8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 190,120 L 320,60 L 290,230 L 140,260 Z" fill="none" stroke="url(#purpleLine)" stroke-width="1.2" stroke-dasharray="5,7">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="10s" repeatCount="indefinite"/>
    </path>
    <path d="M 880,50 L 1020,100 L 960,250 L 820,200 Z" fill="none" stroke="url(#cyanLine)" stroke-width="1.5" stroke-dasharray="6,8">
      <animate attributeName="stroke-dashoffset" values="0;100" dur="8s" repeatCount="indefinite"/>
    </path>
    <path d="M 1020,100 L 1140,50 L 1150,230 L 960,250 Z" fill="none" stroke="url(#emeraldLine)" stroke-width="1.4" stroke-dasharray="5,7">
      <animate attributeName="stroke-dashoffset" values="100;0" dur="9s" repeatCount="indefinite"/>
    </path>

    <!-- Pulsing Nodes -->
    <circle cx="70" cy="60" r="4" fill="#38bdf8"/>
    <circle cx="70" cy="60" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="6;16;6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
    </circle>

    <circle cx="190" cy="120" r="5" fill="#a855f7"/>
    <circle cx="140" cy="260" r="4" fill="#38bdf8"/>
    <circle cx="320" cy="60" r="3.5" fill="#34d399"/>
    <circle cx="290" cy="230" r="4" fill="#a855f7"/>

    <circle cx="880" cy="50" r="4" fill="#38bdf8"/>
    <circle cx="1020" cy="100" r="5" fill="#34d399"/>
    <circle cx="1020" cy="100" r="11" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="7;18;7" dur="3.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="3.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="960" cy="250" r="4.5" fill="#a855f7"/>
    <circle cx="820" cy="200" r="3.5" fill="#38bdf8"/>
    <circle cx="1140" cy="50" r="4" fill="#a855f7"/>
    <circle cx="1150" cy="230" r="5" fill="#38bdf8"/>
    <circle cx="1150" cy="230" r="12" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="8;20;8" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.8;0;0.8" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Foreground Content Area (Unobstructed & Cleanly Readable) -->
  <g transform="translate(600, 0)">
    <!-- Top Category Tag Pill -->
    <g transform="translate(0, 48)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="-116" cy="0" r="4" fill="#10b981"/>
      <text x="0" y="4.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">P2P OVERLAYS • WIREGUARD • ZTNA</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="125" text-anchor="middle" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Mesh VPN &amp; Secure Overlays
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="165" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Curated Zero-Trust Overlay Networks, P2P NAT Hole-Punching &amp; Encrypted Tunnels
    </text>

    <!-- Tech Architecture Feature Badges in Foreground -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: WireGuard -->
      <g transform="translate(-320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">⚡ WIREGUARD</text>
      </g>
      <!-- Badge 2: Headscale / Control Planes -->
      <g transform="translate(-160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#818cf8" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">🌐 HEADSCALE</text>
      </g>
      <!-- Badge 3: Zero Trust ZTNA -->
      <g transform="translate(0, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#c084fc" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#e879f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">🔒 ZERO TRUST</text>
      </g>
      <!-- Badge 4: NAT Traversal -->
      <g transform="translate(160, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#34d399" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">🕳️ NAT TRAVERSAL</text>
      </g>
      <!-- Badge 5: Multi-Cloud Mesh -->
      <g transform="translate(320, 0)">
        <rect x="-65" y="-16" width="130" height="32" rx="6" fill="#0f172a" fill-opacity="0.8" stroke="#fbbf24" stroke-width="1.2"/>
        <text x="0" y="5" text-anchor="middle" fill="#fde68a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">☁️ MULTI-CLOUD</text>
      </g>
    </g>

    <!-- Bottom Secondary Metrics / Meta -->
    <text x="0" y="282" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Enterprise SaaS Suites • Self-Hosted Control Planes • Cryptographic PKI Meshes
    </text>
  </g>
</svg>
